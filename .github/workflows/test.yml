name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auction_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AUCTION_TEST_DATABASE_URL: postgres://postgres:ci_only@127.0.0.1:5432/auction_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...
      - run: go vet ./...
